version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: pastebin_spring_postgres
    environment:
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: pastebin
      POSTGRES_DB: pastebin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pastebin_spring_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: pastebin_spring_api
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: pastebin
      DATABASE_PASSWORD: pastebin
      DATABASE_NAME: pastebin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
