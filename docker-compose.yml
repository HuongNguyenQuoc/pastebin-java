version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: pastebin_spring_postgres
    environment:
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: pastebin
      POSTGRES_DB: pastebin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pastebin_spring_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
